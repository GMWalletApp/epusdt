name: Sync ChainScanner
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: sync-chainscanner
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: scripts/sync-chainscanner main
      - name: Propose upstream update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- chainscanner.rev; then exit 0; fi
          revision=$(cat chainscanner.rev)
          branch="sync/chainscanner-$revision"
          if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- chainscanner chainscanner.rev
            git commit -m "Sync ChainScanner $revision"
            git push origin "$branch"
          fi
          existing=$(gh pr list --head "$branch" --state all --json number --jq length)
          if [[ "$existing" == 0 ]]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "Sync ChainScanner ${revision:0:12}" \
              --body "Update the bundled scanner to https://github.com/GMWalletApp/ChainScanner/commit/$revision. Review and test payment integration before merging."
          fi
