  /payments/gmpay/v1/config:
    get:
      description: |-
        Returns supported_assets for on-chain payments, site and epay defaults, and separate okpay and xlayer hosted payment settings. The xlayer allow_tokens list controls the tokens shown for OKX OnchainOS.
        The authenticated admin variant (/admin/api/v1/config) also includes provider credentials, internal callback settings and the merchant X Layer receiving address.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.PublicConfigResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Get public payment config
      tags:
      - Payment Config
  /payments/gmpay/v1/order/create-transaction:
    post:
      consumes:
      - application/json
      - application/x-www-form-urlencoded
      description: |-
        Create a payment transaction order. Accepts JSON body (application/json) or form-encoded body (application/x-www-form-urlencoded).
        GMPay may omit both token and network to create a status=4 placeholder order; EPay submit.php can also create one when neither request parameters nor database defaults provide token/network. Supplying only one of token/network is invalid.
        payment_type is optional for GMPay. If it is sent, it is a normal signed parameter and must be included when calculating signature.
        GMPay signature uses lowercase hexadecimal HMAC-SHA256 with secret_key as the HMAC key. Legacy MD5 signatures are not accepted.
      parameters:
      - description: Transaction payload (JSON)
        in: body
        name: request
        schema:
          $ref: '#/definitions/request.CreateTransactionRequest'
      - description: Merchant order ID
        in: formData
        name: order_id
        type: string
      - description: Fiat currency (e.g. cny)
        in: formData
        name: currency
        type: string
      - description: Crypto token (e.g. TON, USDT); omit together with network to
          create a placeholder where supported
        in: formData
        name: token
        type: string
      - description: Network (e.g. ton, tron); omit together with token to create
          a placeholder where supported
        in: formData
        name: network
        type: string
      - description: Amount
        in: formData
        name: amount
        type: number
      - description: Callback URL
        in: formData
        name: notify_url
        type: string
      - description: Lowercase hexadecimal HMAC-SHA256 signature
        in: formData
        name: signature
        type: string
      - description: Redirect URL
        in: formData
        name: redirect_url
        type: string
      - description: Order name
        in: formData
        name: name
        type: string
      - description: Optional GMPay compatibility flag; include in signature when
          sent
        in: formData
        name: payment_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.CreateTransactionResponse'
              type: object
        "400":
          description: 'Stable errno in status_code: 10009 invalid params, 10041 invalid
            notify_url, 10004 invalid amount, 10014 chain disabled, 10016 unsupported
            asset, 10003 no wallet, 10005 no amount channel'
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Create transaction
      tags:
      - Payment
  /payments/okpay/v1/notify:
    post:
      consumes:
      - application/json
      - application/x-www-form-urlencoded
      description: |-
        Receives OkPay deposit callbacks for hosted checkout child orders.
        The callback is verified against the configured OkPay shop token and, on success, marks the matching child order as paid.
      produces:
      - text/plain
      responses:
        "200":
          description: success
          schema:
            type: string
        "400":
          description: fail
          schema:
            type: string
      summary: OkPay notify callback
      tags:
      - Payment
