info:
  contact: {}
paths:
  /admin/api/v1/api-keys:
    get:
      description: Returns all API keys
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/mdb.ApiKey'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - AdminJWT: []
      summary: List API keys
      tags:
      - Admin API Keys
    post:
      consumes:
      - application/json
      description: Create a new universal API key. Usable for both gateway flows (epay/gmpay).
        PID auto-incremented; secret returned once.
      parameters:
      - description: API key payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.CreateApiKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/admin.CreateApiKeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - AdminJWT: []
      summary: Create API key
      tags:
      - Admin API Keys
  /admin/api/v1/api-keys/{id}:
    delete:
      description: Soft-delete an API key
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - AdminJWT: []
      summary: Delete API key
      tags:
      - Admin API Keys
    patch:
      consumes:
      - application/json
      description: Patch API key name / ip_whitelist / notify_url
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateApiKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - AdminJWT: []
      summary: Update API key
      tags:
      - Admin API Keys
  /admin/api/v1/api-keys/{id}/rotate-secret:
    post:
      description: Generate a new secret_key. Returned only once.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/admin.RotateSecretResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - AdminJWT: []
      summary: Rotate API key secret
      tags:
      - Admin API Keys
  /admin/api/v1/api-keys/{id}/secret:
    get:
      description: Returns the secret_key for an API key (admin only)
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - AdminJWT: []
      summary: View API key secret
      tags:
      - Admin API Keys
  /admin/api/v1/api-keys/{id}/stats:
    get:
      description: Returns usage stats (call_count, last_used_at) for an API key
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/admin.ApiKeyStatsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - AdminJWT: []
      summary: Get API key stats
      tags:
      - Admin API Keys
  /admin/api/v1/api-keys/{id}/status:
    post:
      consumes:
      - application/json
      description: Toggle enable/disable for an API key (1=enabled, 2=disabled)
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.ChangeApiKeyStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - AdminJWT: []
      summary: Change API key status
      tags:
      - Admin API Keys
  /admin/api/v1/auth/init-password-hash:
    get:
      description: Returns the initial password hash and password-changed flag.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.InitialAdminPasswordHashInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Get initial admin password hash
      tags:
      - Admin Auth
  /admin/api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verify credentials and return a signed JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/admin.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Admin login
      tags:
      - Admin Auth
  /admin/api/v1/auth/logout:
    post:
      description: Logout (no-op, frontend discards token)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - AdminJWT: []
      summary: Admin logout
      tags:
      - Admin Auth
  /admin/api/v1/auth/me:
    get:
      description: Returns the currently authenticated admin user
      produces:
      - application/json
      responses:
        "200":
          description: OK
