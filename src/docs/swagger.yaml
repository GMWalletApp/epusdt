  /pay/check-status/{trade_id}:
    get:
      description: 'Return the current order status by trade ID. Status: 1=waiting
        payment, 2=paid, 3=expired, 4=waiting token/network selection, 5=confirming
        on-chain payment, 6=manual review required.'
      parameters:
      - description: Trade ID
        in: path
        name: trade_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.CheckStatusResponse'
              type: object
        "400":
          description: Order not found (status_code=10008) or other request error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Check payment status
      tags:
      - Payment
  /pay/checkout-counter-resp/{trade_id}:
    get:
      description: |-
        Return checkout initialization data when the order exists. This endpoint only confirms order existence and returns base order data; call /pay/check-status/{trade_id} for the current order status (1=waiting payment, 2=paid, 3=expired, 4=waiting token/network selection, 5=confirming on-chain payment, 6=manual review required).
        When status=4, actual_amount is 0 and token/network/receive_address are empty; this state is produced by GMPay placeholders or EPay submit.php when no token/network request values or defaults resolve to a concrete payment asset. The cashier should guide the payer to choose an on-chain token/network or OkPay and then call /pay/switch-network.
        For EPay orders with a merchant return_url, the response redirect_url is rewritten to the internal /pay/return/{trade_id} hop; the database still stores the merchant's raw return_url.
      parameters:
      - description: Trade ID
        in: path
        name: trade_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.CheckoutCounterResponse'
              type: object
        "400":
          description: Order not found (status_code=10008) or other request error
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Checkout counter page
      tags:
      - Payment
  /pay/return/{trade_id}:
    get:
      description: |-
        Browser-facing success return hop for EPay orders. Paid EPay orders are redirected to the merchant return_url with signed legacy EPay query params. Orders that are not EPay or not yet paid are redirected back to the checkout counter.
        The signed query params reuse the stored request type. On this branch that means either alipay or a supported token.network selector; if the original request omitted type, type=alipay is returned for compatibility.
        This route also returns explicit business errors when the merchant return_url is missing, the order API key is unavailable, or EPay signature construction fails.
      parameters:
      - description: Trade ID
        in: path
        name: trade_id
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to merchant return_url or checkout counter
        "400":
          description: 'Stable errno in status_code: 10008 order not found, 10044
            invalid order redirect url, 10045 order api key unavailable, 10046 failed
            to build epay return signature'
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Return to merchant (EPAY compat)
      tags:
      - Payment
  /pay/submit-tx-hash/{trade_id}:
    post:
      consumes:
      - application/json
      description: |-
        Submit an on-chain transaction hash from the cashier. The hash is verified against the waiting order and, when valid, the same manual payment processing path used by admin mark-paid is executed. Expired orders and OkPay/provider orders are not supported.
        TON accepts canonical ton:<receive_raw>:<lt>:<hash>, lt:hash, or a unique recent hash-only reference for the order receive address.
        Aptos accepts a transaction hash.
        Aptos automatic scanning polls fullnode ledger-version transaction ranges with a runtime cursor.
      parameters:
      - description: Trade ID
        in: path
        name: trade_id
        required: true
        type: string
      - description: Transaction hash payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ManualPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.ManualPaymentResponse'
              type: object
        "400":
          description: 'Stable errno in status_code: 10008 order not found, 10009
            invalid params, 10013 not waiting payment, 10038 verification failed,
            10039 unsupported provider, 10007 hash already processed'
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Submit transaction hash
      tags:
      - Payment
  /pay/switch-network:
    post:
      consumes:
      - application/json
      description: |-
        Switch to a different payment target. A status=4 placeholder is completed in place and returns the same parent trade_id with is_selected=false; an already concrete status=1 parent creates or returns the only sub-order when switching to a different target.
        Normal values such as ton/tron/solana/ethereum select on-chain payment; the special value okpay selects OkPay hosted payment.
        For status=4 placeholders from GMPay or EPay submit.php, both on-chain targets and okpay complete the parent in place without creating a child order. Sub-orders cannot be switched again.
        For EPay orders with a merchant return_url, the returned redirect_url is the internal /pay/return/{trade_id} hop rather than the raw merchant return_url.
      parameters:
      - description: Switch network payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.SwitchNetworkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.CheckoutCounterResponse'
              type: object
        "400":
          description: 'Stable errno in status_code: 10008 order not found, 10011
            sub-order limit, 10012 cannot switch sub-order, 10013 not waiting payment,
            10016 unsupported asset, 10017/10018/10019 provider errors, 10042 provider
            order creation failed'
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Switch payment network
      tags:
      - Payment
