definitions:
  admin.AdminAddWalletRequest:
    properties:
      address:
        example: TTestTronAddress001
        type: string
      network:
        example: tron
        type: string
      remark:
        example: 主钱包
        type: string
    required:
    - address
    - network
    type: object
  admin.AdminBatchImportRequest:
    properties:
      addresses:
        description: |-
          Addresses listed as observation-only wallets. Private-key import
          and API-managed modes are out of scope for v1.
        example:
        - TAddr001
        - TAddr002
        - TAddr003
        items:
          type: string
        type: array
      network:
        example: tron
        type: string
    required:
    - addresses
    - network
    type: object
  admin.AdminChangeWalletStatusRequest:
    properties:
      status:
        description: 状态 1=启用 2=禁用
        enum:
        - 1
        - 2
        example: 1
        type: integer
    type: object
  admin.AdminUpdateWalletRequest:
    properties:
      remark:
        example: 已更新的备注
        type: string
    type: object
  admin.ApiKeyStatsResponse:
    properties:
      call_count:
        example: 342
        type: integer
      last_used_at:
        example: "2026-04-14T08:30:00+00:00"
        type: string
    type: object
  admin.BatchImportResult:
    properties:
      address:
        example: TTestTronAddress001
        type: string
      error:
        example: wallet address already exists
        type: string
      error_code:
        example: 10001
        type: integer
      ok:
        example: true
        type: boolean
    type: object
  admin.ChangeApiKeyStatusRequest:
    properties:
      status:
        description: 状态 1=启用 2=禁用
        enum:
        - 1
        - 2
        example: 1
        type: integer
    type: object
  admin.ChangeChainTokenStatusRequest:
    properties:
      enabled:
        example: true
        type: boolean
    type: object
  admin.ChangeChannelStatusRequest:
    properties:
      enabled:
        example: true
        type: boolean
    type: object
  admin.ChangePasswordRequest:
    properties:
      new_password:
        example: new_pass123
        type: string
      old_password:
        example: old_pass
        type: string
    required:
    - old_password
    type: object
  admin.CreateApiKeyRequest:
    properties:
      ip_whitelist:
        example: ""
        type: string
      name:
        example: My API Key
        type: string
      notify_url:
        example: https://example.com/notify
        type: string
    type: object
  admin.CreateApiKeyResponse:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: My API Key
        type: string
      pid:
        example: "1003"
        type: string
      secret_key:
        description: |-
          SecretKey is returned ONCE on creation. After that, fetch via
          GET /api-keys/:id/secret or rotate to generate a new one.
        example: secret123abc456
        type: string
    type: object
  admin.CreateChainTokenRequest:
    properties:
      contract_address:
        description: |-
          Contract address or chain-native asset identifier. For Aptos this is
          the Move asset id (coin type, metadata address, or object type).
        example: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
        type: string
      decimals:
        example: 6
        type: integer
      enabled:
        example: true
        type: boolean
      min_amount:
        example: 1
        type: number
      network:
        example: tron
        type: string
      symbol:
        example: USDT
        type: string
    required:
    - network
    type: object
  admin.CreateNotificationChannelRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      enabled:
        example: true
        type: boolean
      events: {}
      name:
        example: 主通知群
        type: string
      type:
        enum:
        - telegram
        - webhook
        - email
        example: telegram
        type: string
    required:
    - config
    type: object
  admin.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  admin.LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      user_id:
        example: 1
        type: integer
      username:
        example: admin
        type: string
    type: object
  admin.MeResponse:
    properties:
      created_at:
        example: "2026-04-16 12:00:00"
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        example: 1
        type: integer
      last_login_at:
        example: "2026-04-16 12:00:00"
        type: string
      password_is_default:
        example: true
        type: boolean
      status:
        description: 状态 1=启用 2=禁用
        enum:
        - 1
        - 2
        example: 1
        type: integer
      updated_at:
        example: "2026-04-16 12:00:00"
        type: string
      username:
        example: admin
        type: string
    type: object
  admin.OrderListResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/mdb.Orders'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 100
        type: integer
    type: object
  admin.OrderStatsResponse:
    properties:
      avg_payment_seconds:
        example: 120.5
        type: number
      expired_unpaid_count:
        example: 10
        type: integer
      order_count:
        example: 100
        type: integer
      success_count:
        example: 85
        type: integer
      success_rate:
        example: 0.85
        type: number
    type: object
  admin.OrderWithSub:
    properties:
      actual_amount:
        example: 14.2857
        type: number
      amount:
        example: 100
        type: number
      api_key_id:
        example: 1
        type: integer
      block_transaction_id:
        example: 0xabc123...
        type: string
      callback_confirm:
        description: 回调确认状态 1=回调成功 2=未回调/回调失败
        enum:
        - 1
        - 2
        example: 2
        type: integer
      callback_num:
        example: 0
        type: integer
      created_at:
        example: "2026-04-16 12:00:00"
        type: string
      currency:
        example: CNY
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        example: 1
        type: integer
      is_selected:
        example: false
        type: boolean
      name:
        example: VIP月卡
        type: string
      network:
        example: tron
        type: string
      notify_url:
        example: https://example.com/notify
        type: string
      order_id:
        example: ORD20260416001
        type: string
      parent_trade_id:
        type: string
      pay_by_sub_id:
        description: |-
          PayBySubId holds the primary-key ID of the sub-order that settled this parent order.
          Zero when the parent order was paid directly (no sub-order involved).
        example: 0
        type: integer
      pay_provider:
        description: |-
          PayProvider identifies how this specific order row is collected.

          Semantics:
            - chain parent orders and regular chain child orders use on_chain
            - third-party hosted checkout rows use their provider name
              (for example okpay)

          Existing rows default to on_chain for backward compatibility so upgrades
          can rely on AutoMigrate without rewriting old orders.
        example: on_chain
        type: string
      payment_type:
        description: |-
          PaymentType is not a channel selector. "Epay" changes callback format
          to legacy EPay case-insensitively; "Gmpay" uses GMPay JSON.
        example: Epay
        type: string
      receive_address:
        example: TTestTronAddress001
        type: string
      redirect_url:
        example: https://example.com/success
        type: string
      review_transaction_hash:
        type: string
      status:
        description: 订单状态 1=等待支付 2=支付成功 3=已过期 4=等待选择支付网络/币种 5=链上确认中 6=待人工复核
        enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        example: 1
        type: integer
      sub_orders:
        items:
          $ref: '#/definitions/mdb.Orders'
        type: array
      token:
        example: USDT
        type: string
      trade_id:
        example: 3nQ9pL2xV7sK1mR8cT4yB_aZ
        type: string
      updated_at:
        example: "2026-04-16 12:00:00"
        type: string
    type: object
  admin.OrderWithSubListResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/admin.OrderWithSub'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 100
        type: integer
    type: object
  admin.OverviewResponse:
    properties:
      active_addresses:
        example: 5
        type: integer
      online_chains:
        example: 3
        type: integer
      order_count:
        example: 42
        type: integer
      seven_day_volume:
        example: 700.25
        type: number
      success_rate:
        example: 0.85
        type: number
      total_asset:
        example: 12345.6789
        type: number
      volume:
        example: 100.5
        type: number
    type: object
  admin.RateRefreshRequest:
    properties:
      bases:
        example:
        - cny
        - usd
        items:
          type: string
        maxItems: 20
        type: array
    type: object
  admin.RotateSecretResponse:
    properties:
      secret_key:
        example: newSecret123abc456
        type: string
    type: object
  admin.RpcStatsChainResponse:
    properties:
      display_name:
        example: TRON
        type: string
      enabled:
        example: true
        type: boolean
      failure_count:
        example: 2
        type: integer
      has_data:
        example: true
        type: boolean
      last_sync_at:
        example: "2026-06-09T12:00:00+08:00"
        type: string
      latest_block_height:
        example: 64532100
        type: integer
      network:
        example: tron
        type: string
      status:
        enum:
        - ok
        - warning
        - down
        - unknown
        - disabled
        example: ok
        type: string
      success_count:
        example: 123
        type: integer
      success_rate:
        example: 0.984
        type: number
    type: object
  admin.RpcStatsDashboardResponse:
    properties:
      chains:
        items:
          $ref: '#/definitions/admin.RpcStatsChainResponse'
        type: array
      generated_at:
        example: "2026-06-09T12:00:00+08:00"
        type: string
      summary:
        $ref: '#/definitions/admin.RpcStatsSummaryResponse'
    type: object
  admin.RpcStatsSummaryResponse:
    properties:
      active_chains:
        example: 4
        type: integer
      disabled_chains:
        example: 1
        type: integer
      down_chains:
        example: 0
        type: integer
      enabled_chains:
        example: 5
        type: integer
      failure_count:
        example: 2
        type: integer
      ok_chains:
        example: 3
        type: integer
      success_count:
        example: 123
        type: integer
      success_rate:
        example: 0.984
        type: number
      total_chains:
        example: 6
        type: integer
      unknown_chains:
        example: 1
        type: integer
      warning_chains:
        example: 1
        type: integer
    type: object
  admin.SettingUpsertItem:
    properties:
      group:
        enum:
        - brand
        - rate
        - system
        - epay
        - okpay
        - xlayer
        example: epay
        type: string
      key:
        example: epay.default_network
        type: string
      type:
        enum:
        - string
        - int
        - bool
        - json
        example: string
        type: string
      value: {}
    type: object
  admin.SettingsUpsertRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/admin.SettingUpsertItem'
        type: array
    required:
    - items
    type: object
  admin.SettingsUpsertResult:
    properties:
      error:
        example: invalid setting item
        type: string
      error_code:
        example: 10043
        type: integer
      key:
        example: rate.api_url
        type: string
      ok:
        example: true
        type: boolean
    type: object
  admin.UpdateApiKeyRequest:
    properties:
      ip_whitelist:
        example: 10.0.0.1,192.168.0.0/24
        type: string
      name:
        example: Updated Key Name
        type: string
      notify_url:
        example: https://example.com/notify
        type: string
    type: object
  admin.UpdateChainRequest:
    properties:
      display_name:
        example: Tron
        type: string
      enabled:
        example: true
        type: boolean
      min_confirmations:
        example: 20
        type: integer
      scan_interval_sec:
        example: 5
        type: integer
    type: object
  admin.UpdateChainTokenRequest:
    properties:
      contract_address:
        description: |-
          Contract address or chain-native asset identifier. For Aptos this is
          the Move asset id (coin type, metadata address, or object type).
        example: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
        type: string
      decimals:
        example: 6
        type: integer
      enabled:
        example: true
        type: boolean
      min_amount:
        example: 1
        type: number
    type: object
  admin.UpdateNotificationChannelRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      enabled:
        example: true
        type: boolean
      events: {}
      name:
        example: 更新后的名称
        type: string
    type: object
  admin.WalletListItem:
    properties:
      address:
        example: TTestTronAddress001
        type: string
      created_at:
        example: "2026-04-16 12:00:00"
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        example: 1
        type: integer
      network:
        example: tron
        type: string
      order_count:
        example: 5
        type: integer
      remark:
        example: 主钱包
        type: string
      source:
        enum:
        - manual
        - import
        example: manual
        type: string
      status:
        description: 状态 1=启用 2=禁用
        enum:
        - 1
        - 2
        example: 1
        type: integer
      updated_at:
        example: "2026-04-16 12:00:00"
        type: string
    type: object
  config.RateBaseStatus:
    properties:
      base:
        example: cny
        type: string
      is_stale:
        type: boolean
      last_attempt_at:
        example: "2026-07-22T10:05:00Z"
        type: string
      last_error:
        example: 'call rate api unexpected status: 502 Bad Gateway'
        type: string
      last_refresh_ok:
        type: boolean
      last_success_at:
        example: "2026-07-22T10:00:00Z"
        type: string
      rates:
        additionalProperties:
          format: float64
          type: number
        type: object
      source_url:
        example: https://cdn.example.com/currencies/
        type: string
    type: object
  config.RateRefreshResult:
    properties:
      base:
        example: cny
        type: string
      error:
        example: 'call rate api unexpected status: 502 Bad Gateway'
        type: string
      last_attempt_at:
        example: "2026-07-22T10:05:00Z"
        type: string
      last_success_at:
        example: "2026-07-22T10:00:00Z"
        type: string
      ok:
        type: boolean
      rates:
        additionalProperties:
          format: float64
          type: number
        type: object
      skipped:
        type: boolean
    type: object
  config.RateStatus:
    properties:
      api_url:
        example: https://cdn.example.com/currencies/
        type: string
      bases:
        items:
          $ref: '#/definitions/config.RateBaseStatus'
        type: array
      cache_ttl_seconds:
        example: 300
        maximum: 86400
        minimum: 10
        type: integer
      mode:
        enum:
        - fixed
        - auto
        example: auto
        type: string
    type: object
  data.DailyStat:
    properties:
      actual_amount:
        description: sum of actual_amount (token)
        type: number
      day:
        description: '"YYYY-MM-DD" (daily) or "YYYY-MM-DD HH:00" (hourly)'
        type: string
      order_count:
        type: integer
      success_count:
        type: integer
      total_amount:
        description: sum of amount (fiat)
        type: number
    type: object
  data.InitialAdminPasswordHashInfo:
    properties:
      algorithm:
        example: sha256
        type: string
      available:
        example: true
        type: boolean
      password_changed:
        example: false
        type: boolean
      password_hash:
        example: 3f79bb7b435b05321651daefd374cdc9f5f72c467ea3f9f3c5f6e6d7e8f9a0b1
        type: string
    type: object
  data.MigrationIssue:
    properties:
      host:
        type: string
      id:
        type: integer
      network:
        type: string
      reason:
        type: string
    type: object
  data.MigrationTarget:
    properties:
      store_id:
        type: string
      target:
        type: string
    type: object
  data.NodeMigration:
    properties:
      completed:
        type: integer
      conflicts:
        items:
          $ref: '#/definitions/data.MigrationIssue'
        type: array
      external:
        type: boolean
      pending:
        type: integer
      store_id:
        type: string
      target:
        type: string
    type: object
  engine.ScanProgress:
    properties:
      cursor_height:
        type: integer
      lag_ms:
        type: integer
      network:
        type: string
      status:
        type: string
      target_height:
        type: integer
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  install.InstallRequest:
    properties:
      app_name:
        description: 'Application display name (default: epusdt)'
        example: epusdt
        type: string
      app_uri:
        description: Public base URL of the service, e.g. https://pay.example.com
          (required)
        example: https://pay.example.com
        type: string
      http_bind_addr:
        description: 'Bind address for the HTTP server (default: 127.0.0.1)'
        example: 127.0.0.1
        type: string
      http_bind_port:
        description: 'Bind port for the HTTP server (default: 8000)'
        example: 8000
        type: integer
      log_save_path:
        description: 'Directory for application log files (default: ./logs)'
        example: ./logs
        type: string
      order_expiration_time:
        description: 'Minutes before an unpaid order expires (default: 10)'
        example: 10
        type: integer
      order_notice_max_retry:
        description: 'Maximum webhook retry attempts (default: 1)'
        example: 1
        type: integer
      runtime_root_path:
        description: 'Runtime directory for SQLite DB and temp files (default: ./runtime)'
        example: ./runtime
        type: string
    type: object
  install.InstallSubmitResponse:
    properties:
      init_password:
        description: Initial admin password, returned only while the plaintext is
          still available.
        example: a1b2c3d4e5f6
        type: string
      message:
        description: Completion message for the install request.
        example: install complete, starting server…
        type: string
    type: object
  mdb.ApiKey:
    properties:
      call_count:
        example: 342
        type: integer
      created_at:
        example: "2026-04-16 12:00:00"
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        example: 1
        type: integer
      ip_whitelist:
        example: 192.168.1.0/24,10.0.0.1
        type: string
      last_used_at:
        example: "2026-04-16 12:00:00"
        type: string
      name:
        example: My API Key
        type: string
      notify_url:
        example: https://example.com/notify
        type: string
      pid:
        example: "1000"
        type: string
      status:
        description: 状态 1=启用 2=禁用
        enum:
        - 1
        - 2
        example: 1
        type: integer
      updated_at:
        example: "2026-04-16 12:00:00"
        type: string
    type: object
  mdb.Chain:
    properties:
      created_at:
        example: "2026-04-16 12:00:00"
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      display_name:
        example: Tron
        type: string
      enabled:
        example: true
        type: boolean
      extra:
        example: '{}'
        type: string
      id:
        example: 1
        type: integer
      min_confirmations:
        example: 20
        type: integer
      network:
        example: tron
        type: string
      scan_interval_sec:
        example: 5
        type: integer
      updated_at:
        example: "2026-04-16 12:00:00"
        type: string
    type: object
  mdb.ChainToken:
    properties:
      contract_address:
        example: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
        type: string
      created_at:
        example: "2026-04-16 12:00:00"
        type: string
      decimals:
        example: 6
        type: integer
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      enabled:
        example: true
        type: boolean
      id:
        example: 1
        type: integer
      min_amount:
        example: 1
        type: number
      network:
        example: tron
        type: string
      symbol:
        example: USDT
        type: string
      updated_at:
        example: "2026-04-16 12:00:00"
        type: string
    type: object
  mdb.NotificationChannel:
    properties:
      config:
        example: '{"bot_token":"123:ABC","chat_id":"456"}'
        type: string
      created_at:
        example: "2026-04-16 12:00:00"
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      enabled:
        example: true
        type: boolean
      events:
        example: '{"pay_success":true,"order_expired":true}'
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 主通知群
        type: string
      type:
        enum:
        - telegram
        - webhook
        - email
        example: telegram
        type: string
      updated_at:
        example: "2026-04-16 12:00:00"
        type: string
    type: object
  mdb.Orders:
    properties:
      actual_amount:
        example: 14.2857
        type: number
      amount:
        example: 100
        type: number
      api_key_id:
        example: 1
        type: integer
      block_transaction_id:
        example: 0xabc123...
        type: string
      callback_confirm:
        description: 回调确认状态 1=回调成功 2=未回调/回调失败
        enum:
        - 1
        - 2
        example: 2
        type: integer
      callback_num:
        example: 0
        type: integer
      created_at:
        example: "2026-04-16 12:00:00"
        type: string
      currency:
        example: CNY
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        example: 1
        type: integer
      is_selected:
        example: false
        type: boolean
      name:
        example: VIP月卡
        type: string
      network:
        example: tron
        type: string
      notify_url:
        example: https://example.com/notify
        type: string
      order_id:
        example: ORD20260416001
        type: string
      parent_trade_id:
        type: string
      pay_by_sub_id:
        description: |-
          PayBySubId holds the primary-key ID of the sub-order that settled this parent order.
          Zero when the parent order was paid directly (no sub-order involved).
        example: 0
        type: integer
      pay_provider:
        description: |-
          PayProvider identifies how this specific order row is collected.

          Semantics:
            - chain parent orders and regular chain child orders use on_chain
            - third-party hosted checkout rows use their provider name
              (for example okpay)

          Existing rows default to on_chain for backward compatibility so upgrades
          can rely on AutoMigrate without rewriting old orders.
        example: on_chain
        type: string
      payment_type:
        description: |-
          PaymentType is not a channel selector. "Epay" changes callback format
          to legacy EPay case-insensitively; "Gmpay" uses GMPay JSON.
        example: Epay
        type: string
      receive_address:
        example: TTestTronAddress001
        type: string
      redirect_url:
        example: https://example.com/success
        type: string
      review_transaction_hash:
        type: string
      status:
